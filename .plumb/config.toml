# plumb's own project config. Project-supplied task settings are trust-gated:
# review this file, then run `plumb trust` in the checkout once.

# `make test` sets GOTMPDIR so t.TempDir() lands in the checkout's .testcache,
# and CI runs `make test`. Mirror it so `run_task test` reproduces CI (#537);
# run_task creates the directory, as make's $(TESTCACHE) prerequisite does.
[tasks.go.env]
GOTMPDIR = "{workspace}/.testcache"
