name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.12.2

jobs:
  # ── The gate: build + test + lint on both supported OSes. ──
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so `git describe --tags` resolves the version

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint ${{ env.GOLANGCI_LINT_VERSION }}
        # `go install` instead of the upstream install.sh: the script's master
        # branch greps the checksums file with an unanchored basename, so the
        # v2.12.2 release's new `.tar.gz.sbom.json` asset matches alongside the
        # `.tar.gz` and checksum verification always fails. go install sidesteps it.
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: make verify
        run: make verify

      # go.mod/go.sum drift is invisible locally (the build keeps working) but
      # breaks a fresh clone and quietly widens the dependency surface. `make
      # tidy` existed; nothing checked it had been run.
      - name: go.mod / go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum || {
            echo "::error::go.mod/go.sum are not tidy — run 'make tidy' and commit the result"
            exit 1
          }

  # ── Dependency vulnerabilities. Fast, and the only job that can fail because
  #    of something nobody in this repo changed — so it runs on its own. ──
  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: make vuln

  # ── Coverage floor. ubuntu only: internal/fsguard is Darwin-only and its
  #    statements are unreachable elsewhere, so the total is not comparable
  #    across OSes. Enforcing on one platform keeps the number meaningful. ──
  coverage:
    name: coverage floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: make cover
        run: make cover
      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-profile
          path: .testcache/coverage.out
          if-no-files-found: warn

  # ── Race detector — ubuntu only (slow; one OS is enough to catch data races). ──
  race:
    name: test-race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: make test-race
        run: make test-race

  # ── The credibility job: real-binary LSP integration on both OSes. ──
  # This is what turns "Validated (macOS only)" into "Validated (macOS + Linux)".
  integration:
    name: integration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Put GOPATH/bin on PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install gopls
        run: go install golang.org/x/tools/gopls@latest

      - name: Install pyright
        run: npm install -g pyright

      - name: Verify language servers are on PATH
        run: |
          gopls version
          pyright --version

      - name: make integration-test
        run: make integration-test
