name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Required for a merge queue, and required BEFORE one is enabled. A queued PR
  # is tested on a temporary gh-readonly-queue/ ref via a merge_group event, not
  # a pull_request one — so without this trigger none of the five required
  # checks below ever report for a queue entry, every entry sits until it times
  # out and is ejected, and the queue looks broken rather than unconfigured.
  #
  # Only this workflow needs it: all five required checks are jobs in this file.
  # client-conformance.yml is deliberately NOT queued — it is not a required
  # check, and its pull_request trigger is paths-filtered to cmd/clientsmoke/**,
  # which merge_group cannot express (the event supports branches, not paths).
  # Adding it there would run a ~3.5-minute client matrix on every single merge
  # while gating nothing.
  merge_group:

# Cancel superseded runs on the same ref to save minutes. Safe for the queue:
# each entry gets its own gh-readonly-queue/ ref, so entries never cancel each
# other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The single source of truth for the linter version. scripts/pre-commit reads
  # it from this file and warns when the developer's binary disagrees, because
  # the hook runs `golangci-lint run --fix` off PATH: a local binary NEWER than
  # this pin silently reformats files to a standard CI does not ask for, and
  # they ride along in whoever next runs `git add -A`.
  GOLANGCI_LINT_VERSION: v2.13.1

jobs:
  # ── The gate: build + test + lint on both supported OSes. ──
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so `git describe --tags` resolves the version

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint ${{ env.GOLANGCI_LINT_VERSION }}
        # `go install` instead of the upstream install.sh: the script's master
        # branch greps the checksums file with an unanchored basename, so the
        # `.tar.gz.sbom.json` asset shipped since v2.12.2 matches alongside the
        # `.tar.gz` and checksum verification always fails. go install sidesteps it.
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: make verify
        run: make verify

      # The CHANGELOG placement guard lives here rather than in `make verify` because
      # it is the only guard that needs a base ref, and a working tree does not have
      # one — see the header of scripts/check-changelog-placement.sh. It is a STEP in
      # this job, not a job of its own, on purpose: `verify (ubuntu-latest)` and
      # `verify (macos-latest)` are already required checks, so a step here blocks a
      # merge, whereas a new job would need a branch-protection change to do anything.
      # Running on both legs also exercises the awk under GNU and BSD.
      - name: CHANGELOG placement guard — self-test
        run: make check-changelog-placement-test

      # base.sha comes straight from the event payload, so there is no guessing at
      # whether origin/main is fetched; the object is present because this job checks
      # out with fetch-depth: 0 above. The push case is handled by the step below.
      #
      # head.sha is passed for a reason worth keeping: this job checks out
      # refs/pull/N/merge, whose parent IS base.sha, so without it the merge-base is
      # the base branch tip rather than the branch's fork point — and a branch that is
      # merely behind main then fails for lines it added under a heading that was open
      # when it forked. A branch behind a RELEASE cut is a different matter and is
      # supposed to fail: rule R4 compares base.sha's own headings against the fork
      # point's, so it still catches an entry landing in a section stamped since.
      # --require-base turns an unresolvable base into an error, because on the one
      # path that gates a merge, a skip is a green tick for a check that never ran.
      #
      # R4 DEPENDS ON STRICT STATUS CHECKS, and nothing in the script can enforce it.
      # base.sha is a snapshot from this PR's last opened/synchronize event; it does
      # not move when main does. R4's whole subject is "main released after my last
      # push", so a PR whose last run predates the release would merge on a green,
      # pre-release run without R4 ever seeing the stamp. What closes that is branch
      # protection's "require branches to be up to date before merging" (strict: true
      # on this repo today), which forces a push and so a fresh base.sha first. If
      # strict checks are ever turned off — to add a merge queue, say — R4 silently
      # stops firing on that window; resolve its tip from origin/main then, and see
      # the ENVIRONMENTAL DEPENDENCY paragraph in the script header for why not now.
      - name: CHANGELOG placement guard
        if: github.event_name == 'pull_request'
        run: ./scripts/check-changelog-placement.sh --base ${{ github.event.pull_request.base.sha }} --head ${{ github.event.pull_request.head.sha }} --require-base

      # A PR is not the only way a commit reaches main. Admins are exempt from branch
      # protection here, so the maintainer lands release and pin commits by pushing
      # straight to main, and those never see the step above. github.event.before is
      # the previous tip, which is exactly the base for what this push added.
      #
      # ADVISORY ONLY, and that is the whole design of this step. It cannot pass
      # --head, so its merge-base is the branch tip rather than a PR's fork point,
      # and a branch that was merely BEHIND a release cut then reads as misplaced
      # once it merges — the exact case the pull_request step above deliberately
      # green-lights via --head. Replaying real history, 14 of the last 150
      # first-parent commits on main would have failed this way, and once main is
      # red there is no bypass short of a corrective commit. Some of those 14 are
      # genuine misplacements the PR step tolerates by design, which is why this
      # reports rather than being deleted. Same posture, and same shape, as the
      # npm-audit job's dev-dependency tier below.
      #
      # Also deliberately without --require-base: on a force-push or the first push
      # to a branch, `before` is all-zeros or unreachable, and that must stay a skip.
      - name: CHANGELOG placement guard (push, advisory)
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          if ! ./scripts/check-changelog-placement.sh --base ${{ github.event.before }}; then
            echo "::warning::a CHANGELOG entry on this push looks misplaced — advisory only, because a branch merely behind a release cut reads the same way here (see the step comment in ci.yml); check it landed under the unreleased heading"
          fi

      # go.mod/go.sum tidiness is asserted inside `make verify` (tidy-check) on
      # both OSes — drift is invisible locally (the build keeps working) but
      # breaks a fresh clone, so it gates here rather than relying on memory.

  # ── Dependency vulnerabilities. Fast, and the only job that can fail because
  #    of something nobody in this repo changed — so it runs on its own. ──
  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: make vuln

  # ── npm advisories for the embedded web UI — govulncheck's blind spot. ──
  # The Svelte SPA's dependency tree ships embedded in the binary
  # (internal/web/assets.go), but govulncheck only sees the Go module graph.
  # Same shape as the vuln job: a new advisory can fail this with no code
  # change in the repo, so it runs on its own rather than inside verify.
  #
  # Two tiers, decided deliberately:
  #   - PROD dependencies block at high: their code is bundled into dist/ and
  #     ships embedded in the binary, so a known-bad version there is a
  #     shipped vulnerability.
  #   - DEV (build-time) dependencies are advisory-only. They execute on CI
  #     and dev machines, so findings are real — but a blocking gate fed by a
  #     third-party feed turns main red with no code change in this repo (the
  #     2026-08-13 Go advisory batch did exactly that to govulncheck).
  #     Findings surface as workflow warnings; dependabot carries the fix.
  # The severity floor is high: moderate npm findings are numerous and rarely
  # actionable — the same posture call-site reachability gives the Go side.
  npm-audit:
    name: npm audit (web ui)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: internal/web/ui/package-lock.json
      # npm audit resolves the tree from package-lock.json — no npm ci needed.
      - name: Prod dependencies block at high severity
        working-directory: internal/web/ui
        run: npm audit --omit=dev --audit-level=high
      - name: Dev (build-time) findings are advisory-only
        working-directory: internal/web/ui
        run: |
          if ! npm audit --audit-level=high; then
            echo "::warning::full-tree npm audit reported high+ findings or errored — advisory-only by policy (see the npm-audit job comment); details in this step's log"
          fi

  # ── Coverage floor. ubuntu only: internal/fsguard is Darwin-only and its
  #    statements are unreachable elsewhere, so the total is not comparable
  #    across OSes. Enforcing on one platform keeps the number meaningful. ──
  coverage:
    name: coverage floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: make cover
        run: make cover
      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-profile
          path: .testcache/coverage.out
          if-no-files-found: warn

  # ── Race detector — ubuntu only (slow; one OS is enough to catch data races). ──
  race:
    name: test-race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: make test-race
        run: make test-race

  # ── The embedded web UI is COMMITTED, not built at release time. ──
  # internal/web/assets.go embeds ui/dist, and nothing else in this pipeline
  # rebuilds it, so whatever is committed is what ships. Twice now a dependency
  # bump has refreshed the lockfile and left dist untouched, so the binary
  # carried assets its own source no longer produced. This job rebuilds and
  # fails if the result differs from what is committed.
  #
  # This is only a sound gate because the build is input-independent. It was not:
  # Tailwind scans dist/ (not gitignored, since the assets are committed), and
  # the vendored JS vite bundles into it re-admits the very code the ignore rule
  # keeps out of node_modules, so utilities appeared for tokens no Svelte file
  # uses and the output depended on whether dist/ was present. src/app.css now
  # excludes it with `@source not "../dist"`. That directive fails SILENTLY if
  # its path is wrong, so if this job starts failing on an untouched tree,
  # suspect the exclusion before assuming someone skipped `make web-ui`.
  web-ui-fresh:
    name: web ui freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: internal/web/ui/package-lock.json
      - name: make web-ui
        run: make web-ui
      - name: dist must match the committed assets
        run: |
          # porcelain, not `git diff`: a diff cannot see an UNTRACKED file, so a
          # newly emitted asset (a code-split chunk, a font) would leave every
          # tracked file matching and the gate green, shipping an index.html
          # that references something not embedded.
          drift="$(git status --porcelain -- internal/web/ui/dist)"
          if [ -n "$drift" ]; then
            echo "$drift"
            git diff --stat -- internal/web/ui/dist || true
            echo "::error::internal/web/ui/dist is stale — run 'make web-ui' and commit the result."
            exit 1
          fi

  # ── The credibility job: real-binary LSP integration on both OSes. ──
  # This is what turns "Validated (macOS only)" into "Validated (macOS + Linux)".
  integration:
    name: integration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          # Node is here only to install the npm-published language servers in
          # the step below. Kept in step with the other jobs in this file: Node
          # 20 went end-of-life on 2026-04-30, so it stops receiving upstream
          # security patches with no change on our side. Dependabot cannot catch
          # this — it tracks the action version, not this input.
          node-version: "22"

      - name: Put GOPATH/bin on PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install gopls
        run: go install golang.org/x/tools/gopls@latest

      # typescript-language-server and vscode-html-language-server already have
      # integration tests, and those tests skipped on every run because the
      # binaries were absent — so "integration green" only ever meant Go and
      # Python. Installing them is the whole change: the tests un-skip on their
      # own. Four adapters still skip here: zls, jdtls and kotlin-lsp are not
      # npm-published, and rust-analyzer skips because the runner image ships a
      # rustup SHIM of that name which is on PATH without the component being
      # installed — the rust test probes --version to catch exactly that. See
      # docs/adding-an-lsp.md for the per-adapter status.
      #
      # typescript@5 is pinned deliberately: plain `typescript` now resolves to
      # TypeScript 7, the Go-native rewrite, which ships no `tsserver`. The
      # language server then fails to initialize with "Could not find a valid
      # TypeScript installation" and its test SKIPS — coverage quietly drops
      # instead of the run going red.
      - name: Install npm-published language servers
        run: npm install -g pyright typescript-language-server typescript@5 vscode-langservers-extracted

      - name: Verify language servers are on PATH
        run: |
          gopls version
          pyright --version
          typescript-language-server --version
          command -v vscode-html-language-server

      - name: make integration-test
        run: make integration-test
