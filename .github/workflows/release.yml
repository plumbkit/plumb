name: Release

on:
  push:
    tags:
      - "v*"
  # Run the tap-token preflight on demand, without cutting a release. Every
  # other job is gated on a tag ref below, so a dispatch runs the credential
  # check ALONE — it can never publish anything.
  workflow_dispatch: {}

permissions:
  contents: write # create the GitHub release and upload artifacts

jobs:
  # Fail fast on a lapsed Homebrew tap credential.
  #
  # This exists because the tap push is the LAST thing goreleaser does, so an
  # expired HOMEBREW_TAP_TOKEN goes red only after a full cross-platform build,
  # long after the release, the binaries and the MCP registry entry have all
  # published successfully. That is a failure mode nobody reads: it ate v0.17.5,
  # v0.17.6 and v0.17.7 unnoticed, each time with the formula then hand-committed
  # after the fact. Ten seconds of API call up front turns a silent post-release
  # discovery into a loud pre-build one.
  #
  # Read-only by construction: it asks whether the token COULD push and prints
  # only the resulting boolean. The token is never echoed — gh reads it from the
  # environment and never renders it, and no command here interpolates it.
  tap-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Verify HOMEBREW_TAP_TOKEN can push to the tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP: plumbkit/homebrew-plumb
        run: |
          set -uo pipefail
          remedy="Mint a PAT with push access to $TAP, then: gh secret set HOMEBREW_TAP_TOKEN --repo ${{ github.repository }}"
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error title=Tap token missing::HOMEBREW_TAP_TOKEN is not set on ${{ github.repository }}. $remedy"
            exit 1
          fi
          # Capture stderr so a 401 can be told from a 404 without printing a body
          # that might echo request context.
          if ! err=$(gh api "repos/$TAP" --jq .permissions.push 2>&1 >/tmp/push); then
            case "$err" in
              *401*|*"Bad credentials"*)
                echo "::error title=Tap token invalid::HOMEBREW_TAP_TOKEN was rejected with 401 Bad credentials — the PAT has expired or been revoked. $remedy" ;;
              *404*)
                echo "::error title=Tap not visible::HOMEBREW_TAP_TOKEN cannot see $TAP (404). A fine-grained PAT must select that repository and may need org approval. $remedy" ;;
              *)
                echo "::error title=Tap preflight failed::$err" ;;
            esac
            exit 1
          fi
          if [ "$(cat /tmp/push)" != "true" ]; then
            echo "::error title=Tap token lacks write::HOMEBREW_TAP_TOKEN reaches $TAP but cannot push (needs classic 'repo' scope, or fine-grained Contents: read and write). $remedy"
            exit 1
          fi
          echo "tap token OK — can push to $TAP"

  client-conformance:
    # Tag pushes only: a workflow_dispatch is a credential check, not a release.
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/client-conformance.yml

  goreleaser:
    # tap-preflight is a hard dependency, not advisory: building four platforms
    # to fail at the last step is exactly the waste it exists to prevent. A
    # failed preflight skips this job, which also skips publish-mcp below — so a
    # bad token stops the release cleanly BEFORE anything is published, rather
    # than half-way through.
    needs: [client-conformance, tap-preflight]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # GoReleaser needs full history + tags

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          # Default token creates the release in THIS repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with push access to plumbkit/homebrew-plumb, so the formula can be
          # pushed cross-repo. Validated by tap-preflight above before any build
          # runs; `gh workflow run release.yml` checks it without cutting a release.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  publish-mcp:
    # Republish to the official MCP Registry after the GitHub release exists, so
    # the registry never advertises a version without a real release behind it.
    # Runs even if goreleaser failed at a post-release step (e.g. the Homebrew
    # tap push on a lapsed HOMEBREW_TAP_TOKEN) — a token lapse must not strand
    # the registry entry. The existence check below keeps the invariant when
    # goreleaser failed before creating the release at all.
    needs: goreleaser
    if: ${{ !cancelled() && needs.goreleaser.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # GitHub OIDC proves the io.github.plumbkit namespace — no secret needed
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Verify the GitHub release exists
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::release ${GITHUB_REF_NAME} not found; skipping MCP publish"
          fi

      - name: Stamp server.json version from the tag
        if: steps.release.outputs.exists == 'true'
        # Defensive: version_meta_test.go already pins server.json == VERSION at commit time;
        # this guards a hand-cut tag and is idempotent when they already match.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Install mcp-publisher
        if: steps.release.outputs.exists == 'true'
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to the MCP Registry (GitHub OIDC)
        if: steps.release.outputs.exists == 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish server to the MCP Registry
        if: steps.release.outputs.exists == 'true'
        run: ./mcp-publisher publish
