name: Client conformance

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "23 15 * * *"
  pull_request:
    branches: [main]
    paths:
      - cmd/clientsmoke/**
      - .github/workflows/client-conformance.yml
      - Makefile

permissions:
  contents: read

env:
  CODEX_VERSION: 0.146.1
  OPENCODE_VERSION: 1.18.0

jobs:
  # On a pull_request (path-filtered above) this is a fast PR-time signal, not
  # the full release/nightly gate: one OS (ubuntu-latest) only. The 2-OS matrix
  # stays intact for workflow_call (release.yml) and the nightly schedule —
  # macOS-only client behaviour differences are exactly what the nightly run
  # and the release gate exist to catch, and a PR should not pay 2x the cost
  # to detect a mistake that is almost always OS-independent (a broken harness
  # change or a bad workflow edit). The 3x internal repeat is kept as-is on
  # every trigger, including PRs: it is the determinism check itself, not
  # matrix breadth, and dropping it would blunt the one thing this tier is
  # for.
  deterministic:
    name: deterministic clients (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    # Worst-case legitimate run per OS: 3 attempts x the internal 10m go test
    # timeout (30m), plus npm installing the two pinned client CLIs and the Go
    # module/build warm-up on a cold runner (call it another 10-15m of
    # headroom, generously). 45 minutes leaves comfortable margin above that
    # without drifting anywhere near GitHub's 6-hour default, so a hung client
    # fails the job in under an hour instead of silently holding a release (or
    # a PR check) for hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install pinned clients
        run: npm install --global "@openai/codex@${CODEX_VERSION}" "opencode-ai@${OPENCODE_VERSION}"

      - name: Verify client versions
        run: |
          codex --version | grep -F "${CODEX_VERSION}"
          test "$(opencode --version)" = "${OPENCODE_VERSION}"

      - name: Run deterministic matrix three times
        env:
          TMPDIR: ${{ runner.temp }}/client-conformance
        run: |
          mkdir -p "$TMPDIR"
          for attempt in 1 2 3; do
            echo "conformance attempt $attempt/3"
            make clients-test-conformance
          done

      - name: Upload failure-only evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: client-conformance-${{ matrix.os }}
          path: ${{ runner.temp }}/client-conformance/clientsmoke-failure-*
          if-no-files-found: warn
          retention-days: 14
